# 빌드는 GitHub이, 실행은 우리 서버가.
#
# main 에 push 하면:
#   1) GitHub Actions 러너에서 arm64 이미지를 굽고
#   2) GHCR(이미지 창고)에 올리고
#   3) SSH 로 서버에 들어가 pull 후 재기동한다.
#
# 서버에서 빌드하지 않는 이유 셋
#   - 서버 CPU·메모리를 빌드가 잡아먹어 서비스가 느려진다 (RAM 1.8Gi 라 특히)
#   - 빌드가 중간에 실패하면 서버에 반쯤 부서진 상태가 남는다
#   - 테스트한 것과 배포된 것이 같다는 보장이 사라진다  ← 이게 제일 크다

name: Build & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # PR 에서도 test 잡만 돈다(build·deploy 는 아래 if 로 막는다).
  #   이게 없으면 테스트가 main 에 머지된 뒤에야 처음 돌아간다. 그러면
  #   "테스트하고 머지한다"가 불가능해지고, 깨진 걸 알았을 땐 이미 main 이 깨져 있다.
  #   로컬에 JDK 21 이 없는 사람도 PR 만 열면 검증이 되는 효과도 있다.
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch: {}      # 액션 탭에서 손으로도 돌릴 수 있게

concurrency:
  # 배포가 겹치면 서버 상태가 꼬인다. 새 배포가 뜨면 진행 중인 건 취소.
  # ref 를 키에 넣는 이유: 안 넣으면 PR 검증 실행끼리, 또 PR 과 main 배포가
  # 서로를 취소한다(그룹이 하나뿐이라서).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    # Dockerfile 은 -x test 로 테스트를 건너뛴다 — 이미지 빌드는 가볍게 유지하고,
    # 검증은 여기서 러너의 네이티브 Gradle로 한다. 여기서 실패하면 build/deploy 가
    # 아예 안 돈다(need로 이어짐) — Dockerfile 의 -x test 는 그대로 둔다.
    runs-on: ubuntu-latest
    services:
      # 자동 생성된 ServerApplicationTests.contextLoads() 가 전체 스프링 컨텍스트를
      # 띄우면서 Flyway가 즉시 DB에 접속한다. 러너는 빈 우분투라 이게 없으면
      # "java.net.ConnectException" 으로 죽는다. application.yaml 의 기본값
      # (DB_URL 미설정 시 jdbc:postgresql://localhost:5432/bbangmoa, 계정 bbangmoa)
      # 과 정확히 맞춰서 별도 환경변수 없이 그대로 붙게 한다.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bbangmoa
          POSTGRES_USER: bbangmoa
          POSTGRES_PASSWORD: localdev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bbangmoa -d bbangmoa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # RateLimitInterceptor 가 StringRedisTemplate 을 주입받으면서 컨텍스트에
      # 레디스 연결 팩토리가 생긴다. Lettuce 는 지연 연결이라 없어도 부팅 자체는
      # 되지만, 테스트가 인터셉터를 실제로 타는 순간부터는 필요하다.
      # 포스트그레를 붙인 것과 같은 이유로 미리 붙인다.
      # application.yaml 기본값(REDIS_HOST:localhost, REDIS_PORT:6379)에 그대로 맞춘다.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - run: ./gradlew test

  build:
    needs: test
    # PR 에서는 굽지도 배포하지도 않는다. 검증만 한다.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # GHCR 에 push 하려면 필요
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 태그 정하기
        id: meta
        run: |
          # 커밋 해시 앞 7자리를 버전으로 쓴다.
          # :latest 만 쓰면 가리키는 대상이 계속 바뀌어 되돌릴 이전 버전을 특정할 수 없다.
          echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: QEMU 설치 (x86 러너에서 arm64 를 굽기 위해)
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # 워크플로에 자동 제공. 따로 만들 것 없음

      - name: 빌드 & 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # ★ 서버가 t4g(ARM) 라서 arm64. amd64 로 구우면 exec format error 로 안 뜬다.
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 서버로 파일 전송 (compose + env)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: docker-compose.yml
          target: ~/app/bbangmoa

      - name: 배포
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true          # 한 줄이라도 실패하면 즉시 중단
          script: |
            set -euo pipefail
            cd ~/app/bbangmoa

            # 이번에 배포할 버전을 .env 에 적는다. compose 가 ${TAG} 로 읽는다.
            # DB 비밀번호 등 나머지 값은 서버의 .env 에 이미 있고 건드리지 않는다.
            sed -i '/^TAG=/d' .env 2>/dev/null || true
            echo "TAG=${{ needs.build.outputs.tag }}" >> .env

            docker compose pull
            docker compose up -d --remove-orphans

            # ── 헬스체크가 진짜로 도는지 확인 ──
            # SISC 는 Dockerfile 의 HEALTHCHECK 가 꺼져 있어 이 필드가 영원히 없고,
            # 그래서 폴링 루프가 60초 헛돌다 성공으로 끝난다. 우리는 켰으므로 실제로 판정된다.
            # case/esac 의 ;; 는 이 액션이 스크립트를 bash -c 로 넘기는 과정에서
            # 문법 오류를 낸다. if 로만 쓴다.
            echo "api 컨테이너가 healthy 가 될 때까지 대기..."
            ok=0
            reason="120초 안에 healthy 가 되지 않았다"
            for i in $(seq 1 40); do
              status=$(docker inspect --format='{{.State.Health.Status}}' bbangmoa-api 2>/dev/null || echo "none")
              if [ "$status" = "healthy" ]; then
                echo "정상 기동 확인 (${i}회차, $((i*3))초)"
                ok=1
                break
              fi
              if [ "$status" = "none" ]; then
                reason="헬스체크가 정의돼 있지 않다 — Dockerfile 의 HEALTHCHECK 확인 필요"
                break
              fi
              if [ "$status" = "unhealthy" ]; then
                reason="unhealthy 판정"
                break
              fi
              sleep 3
            done

            if [ "$ok" != "1" ]; then
              echo "배포 실패: $reason"
              docker logs --tail 80 bbangmoa-api || true
              exit 1
            fi

            # 롤백: 서버에서 .env 의 TAG 를 이전 커밋 해시로 바꾸고
            #   cd ~/app/bbangmoa && docker compose up -d
            # 그래서 :latest 만 쓰지 않고 커밋 해시 태그를 같이 붙인다.
